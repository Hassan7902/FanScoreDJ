
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FanScore DJ</title>
<style>
body{margin:0;padding:20px;background:#071426;color:white;font-family:Arial;text-align:center}
.card{max-width:430px;margin:20px auto;padding:20px;background:#13263e;border-radius:15px}
h1{color:#4ade80}
input,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:9px}
input{background:#071426;color:white;border:1px solid #52657d}
button{background:#16a34a;color:white;border:0;font-weight:bold;cursor:pointer}
#status{overflow-wrap:anywhere;color:#facc15}
</style>
</head>
<body>
<h1>⚽ FanScore DJ</h1>
<p>Les pronostics gratuits de Djibouti</p>

<div class="card">
<h2>Connexion à FanScore DJ</h2>
<input id="key" placeholder="Clé publique Supabase">
<button onclick="connect()">Connecter</button>
<p id="status">Base de données non connectée</p>
</div>

<div class="card" id="account" hidden>
<h2>Créer ton compte</h2>
<input id="nickname" maxlength="25" placeholder="Choisis ton pseudo">
<button onclick="createProfile()">Créer mon compte</button>
<p id="profileStatus"></p>
</div>

<div class="card" id="welcome" hidden>
<h2>Bienvenue sur FanScore DJ !</h2>
<p id="playerName"></p>
<p id="playerPoints"></p>
<p>⚽ Pronostics gratuits, sans argent misé.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const PROJECT_URL="https://seegkcomvgqklvqtynfx.supabase.co";
let db=null;
let player=null;

async function connect(){
 const key=document.getElementById("key").value.trim();
 const status=document.getElementById("status");
 if(!key){status.innerText="Entre ta clé publique.";return;}
 status.innerText="Connexion...";
 try{
  db=window.supabase.createClient(PROJECT_URL,key);
  const {data,error}=await db.auth.getSession();
  if(error) throw error;
  localStorage.setItem("fanscore_key",key);
  status.innerText="✅ Base de données connectée !";
  await startAccount();
 }catch(e){
  status.innerText="Erreur : "+e.message;
 }
}

async function startAccount(){
 const box=document.getElementById("account");
 const welcome=document.getElementById("welcome");
 const {data:{session},error}=await db.auth.getSession();
 if(error) throw error;
 let user=session?.user;
 if(!user){
  const result=await db.auth.signInAnonymously();
  if(result.error) throw result.error;
  user=result.data.user;
 }
 const result=await db.from("players").select("*").eq("id",user.id).maybeSingle();
 if(result.error) throw result.error;
 if(result.data){
  player=result.data;
  showPlayer();
 }else{
  box.hidden=false;
 }
}

async function createProfile(){
 const nickname = document.getElementById("nickname").value.trim();
 const message=document.getElementById("profileStatus");
 if(nickname.length<3){message.innerText="Choisis un pseudo de 3 caractères minimum.";return;}
 message.innerText="Création du compte...";
 const {data:{user},error:authError}=await db.auth.getUser();
 if(authError||!user){message.innerText="Reconnecte-toi.";return;}
 const {data,error}=await db.from("players").insert({
  id:user.id,nickname:nickname,points:0
 }).select().single();
 if(error){message.innerText="Erreur : "+error.message;return;}
 player=data;
 showPlayer();
}

function showPlayer(){
 document.getElementById("account").hidden=true;
 document.getElementById("welcome").hidden=false;
 document.getElementById("playerName").innerText="Pseudo : "+player.nickname;
 document.getElementById("playerPoints").innerText="Points : "+player.points;
}

const saved=localStorage.getItem("fanscore_key");
if(saved) document.getElementById("key").value=saved;
</script>
</body>
</html>
