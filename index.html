
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FanScore DJ</title>
<style>
body{margin:0;background:#071426;color:white;font-family:Arial,sans-serif;text-align:center;padding:20px}
.card{background:#13263e;padding:20px;border-radius:16px;max-width:450px;margin:20px auto}
input,button{width:100%;padding:13px;margin:8px 0;border-radius:9px;box-sizing:border-box}
input{border:1px solid #52657d;background:#071426;color:white}
button{border:0;background:#16a34a;color:white;font-weight:bold;cursor:pointer}
h1{color:#4ade80}
.small{color:#b8c5d6;font-size:14px}
</style>
</head>
<body>
<h1>⚽ FanScore DJ</h1>
<p>Pronostics football gratuits à Djibouti</p>

<div class="card">
<h2>Connexion à la base de données</h2>
<input id="key" placeholder="Colle ici ta clé publique Supabase">
<button onclick="connect()">Connecter FanScore DJ</button>
<p id="status">Base de données non connectée</p>
</div>

<div class="card">
<h2>Bienvenue !</h2>
<p class="small">Pronostique gratuitement. Gagne des points. Défie tes amis.</p>
<p>⚽ Pas d'argent misé. Aucun pari réel.</p>
</div>

<script>
const URL="https://seegkcomvgqklvqtynfx.supabase.co";
async function connect(){
 const key=document.getElementById("key").value.trim();
 const status=document.getElementById("status");
 if(!key){status.innerText="Colle d'abord ta clé publique.";return;}
 status.innerText="Connexion en cours...";
 try{
  const r=await fetch(URL+"/rest/v1/players?select=*&limit=1",{
   headers:{"apikey":key,"Authorization":"Bearer "+key}
  });
  if(r.ok){
   localStorage.setItem("fanscore_key",key);
   status.innerText="✅ FanScore DJ est connecté à Supabase !";
  }else{
   status.innerText="Erreur de connexion ("+r.status+"). Vérifie la clé et les autorisations.";
  }
 }catch(e){
  status.innerText="Connexion impossible. Vérifie Internet.";
 }
}
const saved=localStorage.getItem("fanscore_key");
if(saved){document.getElementById("key").value=saved;}
</script>
</body>
</html>
